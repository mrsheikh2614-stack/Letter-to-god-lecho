<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Letter to God - Class 10 MCQ Test</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#eef3f9;color:#172033}
.page{min-height:100vh;padding:25px 14px}
.container{max-width:850px;margin:auto}
.header{background:linear-gradient(135deg,#173b75,#2563eb);color:white;padding:28px 20px;border-radius:18px;text-align:center;margin-bottom:18px}
.header h1{margin:0 0 8px;font-size:30px}.header p{margin:0;opacity:.9}
.card{background:white;padding:20px;border-radius:15px;margin:14px 0;box-shadow:0 4px 15px rgba(0,0,0,.07)}
.question{font-size:18px;font-weight:bold;margin-bottom:15px}
.option{display:block;border:1px solid #d9e1ec;border-radius:10px;padding:12px;margin:9px 0;cursor:pointer}
.option:hover{background:#f3f7ff}
.option input{margin-right:9px}
.actions{text-align:center;margin:25px 0}
button{border:0;border-radius:11px;padding:13px 24px;background:#2563eb;color:white;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{opacity:.9}
#resultPage{display:none}
.resultBox{text-align:center;background:white;border-radius:18px;padding:30px;box-shadow:0 5px 20px rgba(0,0,0,.09)}
.score{font-size:48px;font-weight:900;color:#2563eb;margin:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:25px 0}
.stat{background:#f4f7fb;border-radius:12px;padding:18px}.stat b{font-size:28px;display:block;color:#173b75}
.review{text-align:left;margin-top:20px}
.reviewItem{padding:14px;border-radius:11px;margin:9px 0;border:1px solid #ddd}
.correct{background:#ecfdf3;border-color:#86efac}.wrong{background:#fef2f2;border-color:#fca5a5}
.reviewItem b{display:block;margin-bottom:7px}
.small{font-size:13px;color:#667085}
@media(max-width:600px){.stats{grid-template-columns:1fr}.header h1{font-size:24px}}
</style>
</head>
<body>

<section id="quizPage" class="page">
<div class="container">
<div class="header">
<h1>A Letter to God</h1>
<p>Class 10 English • 20 MCQ Test • 1 Mark Each</p>
</div>
<div id="quiz"></div>
<div class="actions"><button onclick="submitTest()">Submit Test</button></div>
</div>
</section>

<section id="resultPage" class="page">
<div class="container">
<div class="header">
<h1>Test Result</h1>
<p>Your final performance</p>
</div>
<div class="resultBox">
<div class="score" id="score"></div>
<h2 id="resultTitle"></h2>
<p id="resultMessage"></p>
<div class="stats">
<div class="stat"><b id="correctCount">0</b>Correct</div>
<div class="stat"><b id="wrongCount">0</b>Wrong</div>
<div class="stat"><b id="percent">0%</b>Percentage</div>
</div>
<div class="review">
<h2>Answer Review</h2>
<div id="review"></div>
</div>
<br>
<button onclick="location.reload()">Take Test Again</button>
</div>
</div>
</section>

<script>
const questions = [{"id": 1, "q": "Where was Lencho’s house situated?", "options": ["At the bottom of a hill", "On the crest of a low hill", "In a city", "Near a river"], "answer": 1}, {"id": 2, "q": "What crop was growing in Lencho’s field?", "options": ["Rice", "Wheat", "Corn", "Barley"], "answer": 2}, {"id": 3, "q": "What did Lencho think the earth needed?", "options": ["A strong wind", "A shower", "Snow", "More sunlight"], "answer": 1}, {"id": 4, "q": "What did the raindrops look like to Lencho?", "options": ["Pearls", "New coins", "Diamonds", "Silver balls"], "answer": 1}, {"id": 5, "q": "What destroyed Lencho’s crop?", "options": ["Flood", "Drought", "Hailstorm", "Strong wind"], "answer": 2}, {"id": 6, "q": "How long did the hailstorm last?", "options": ["Half an hour", "One hour", "Two hours", "Three hours"], "answer": 1}, {"id": 7, "q": "What did the field look like after the hailstorm?", "options": ["Covered with flowers", "Covered with salt", "Covered with water", "Covered with dust"], "answer": 1}, {"id": 8, "q": "What was Lencho’s only hope after the crop was destroyed?", "options": ["His neighbours", "The government", "Help from God", "The postmaster"], "answer": 2}, {"id": 9, "q": "How much money did Lencho ask God for?", "options": ["50 pesos", "70 pesos", "100 pesos", "120 pesos"], "answer": 2}, {"id": 10, "q": "Why did Lencho write a letter to God?", "options": ["To thank God", "To ask for money", "To invite God", "To complain about the post office"], "answer": 1}, {"id": 11, "q": "Who read Lencho’s letter?", "options": ["The postmaster", "The postman", "A farmer", "Lencho’s son"], "answer": 0}, {"id": 12, "q": "What did the postmaster decide to do?", "options": ["Ignore the letter", "Help Lencho and preserve his faith", "Send Lencho away", "Write to the government"], "answer": 1}, {"id": 13, "q": "How much money was the postmaster able to collect?", "options": ["50 pesos", "70 pesos", "80 pesos", "100 pesos"], "answer": 1}, {"id": 14, "q": "How did Lencho react when he received the money?", "options": ["He was angry with God", "He was happy that God had helped him", "He returned the money", "He thanked the postmaster"], "answer": 1}, {"id": 15, "q": "What did Lencho think had happened to the remaining money?", "options": ["God forgot it", "The post office employees had stolen it", "His family spent it", "It was lost in the rain"], "answer": 1}, {"id": 16, "q": "What did Lencho call the post-office employees?", "options": ["Angels", "Friends", "A bunch of crooks", "Good people"], "answer": 2}, {"id": 17, "q": "What is the main theme of the story?", "options": ["Adventure", "Faith and irony", "Friendship", "Competition"], "answer": 1}, {"id": 18, "q": "What does ‘amiable’ mean?", "options": ["Friendly", "Angry", "Weak", "Unhappy"], "answer": 0}, {"id": 19, "q": "Who is the author of ‘A Letter to God’?", "options": ["G. L. Fuentes", "R. K. Narayan", "Ruskin Bond", "O. Henry"], "answer": 0}, {"id": 20, "q": "What is the irony at the end of the story?", "options": ["Lencho hated rain", "The people who helped Lencho were called crooks by him", "The postmaster did not read the letter", "Lencho never received any money"], "answer": 1}];

const quiz = document.getElementById("quiz");

questions.forEach(item=>{
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`
    <div class="question">Q${item.id}. ${item.q}</div>
    ${item.options.map((op,i)=>`
      <label class="option">
        <input type="radio" name="q${item.id}" value="${i}">
        ${String.fromCharCode(65+i)}. ${op}
      </label>
    `).join("")}
  `;
  quiz.appendChild(card);
});

function submitTest(){
  let correct=0;
  let wrong=0;
  let review="";

  questions.forEach(item=>{
    const selected=document.querySelector(`input[name="q${item.id}"]:checked`);
    const selectedValue=selected ? Number(selected.value) : null;
    const isCorrect=selectedValue===item.answer;

    if(isCorrect) correct++;
    else wrong++;

    review += `
      <div class="reviewItem ${isCorrect?'correct':'wrong'}">
        <b>Q${item.id}. ${item.q}</b>
        <div>Your answer: ${selected ? item.options[selectedValue] : "Not attempted"}</div>
        <div>Correct answer: ${item.options[item.answer]}</div>
        <div class="small">${isCorrect ? "✓ Correct — 1 mark" : "✗ Wrong — 0 marks"}</div>
      </div>
    `;
  });

  const total=questions.length;
  const percentage=Math.round((correct/total)*100);

  document.getElementById("score").textContent=`${correct} / ${total}`;
  document.getElementById("correctCount").textContent=correct;
  document.getElementById("wrongCount").textContent=wrong;
  document.getElementById("percent").textContent=percentage+"%";
  document.getElementById("review").innerHTML=review;

  if(correct===total){
    document.getElementById("resultTitle").textContent="🎉 Excellent! All Answers Correct!";
    document.getElementById("resultMessage").textContent="You scored full marks.";
  }else{
    document.getElementById("resultTitle").textContent="Your Final Score";
    document.getElementById("resultMessage").textContent=`You got ${correct} correct and ${wrong} wrong.`;
  }

  document.getElementById("quizPage").style.display="none";
  document.getElementById("resultPage").style.display="block";
  window.scrollTo({top:0,behavior:"smooth"});
}
</script>
</body>
</html>
